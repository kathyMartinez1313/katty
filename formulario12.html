<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formulario - Music mente de caos</title>
<style>
  :root{
    --slate:#2a3a4b;
    --slate-dark:#1b2733;
    --aqua:#3fd8c4;
    --sky:#2f9be0;
    --lime:#5de04a;
    --cream:#fff7d6;
    --ok:#1fb86a;
    --bad:#e5383b;
    --text:#ffffff;
    --heading: "Arial Black","Segoe UI Black","Segoe UI",Arial,sans-serif;
    --body: "Segoe UI",Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  html,body{min-height:100%}
  body{
    font-family:var(--body);
    color:var(--text);
    background:#37d9cf;
    display:flex;
    min-height:100vh;
    padding:10px;
    gap:10px;
  }

  /* ---------- Barra lateral ---------- */
  .side{
    width:230px;flex-shrink:0;
    background:linear-gradient(180deg,#183644 0%,#14303b 60%,#10272f 100%);
    border-radius:18px;padding:24px 16px;
    display:flex;flex-direction:column;gap:26px;
    box-shadow:0 10px 26px rgba(0,0,0,.3);
  }
  .brand{display:flex;align-items:center;gap:12px;padding:0 4px}
  .brand .logo{
    width:54px;height:54px;border-radius:12px;flex-shrink:0;
    background:linear-gradient(135deg,var(--aqua),var(--sky));
    display:grid;place-items:center;font-size:28px;
  }
  .brand h2{font-family:var(--heading);font-size:18px;line-height:1.15;color:#fff}
  .side-title{font-family:var(--heading);font-size:19px;padding:0 6px;display:flex;gap:10px;align-items:center}
  .side nav{display:flex;flex-direction:column;gap:4px}
  .side nav a{
    display:flex;align-items:center;gap:14px;
    color:var(--text);text-decoration:none;font-weight:700;font-size:14px;
    padding:11px 12px;border-radius:10px;transition:background .2s,color .2s;
  }
  .side nav a .ico{width:18px;text-align:center;font-size:14px;opacity:.85}
  .side nav a:hover,.side nav a:focus-visible{background:rgba(0,0,0,.35);outline:none}

  /* ---------- Zona principal ---------- */
  .main{
    flex:1;
    border-radius:18px;
    padding:34px clamp(16px,4vw,48px) 48px;
    background:linear-gradient(180deg,#1b625f 0%,#27908f 40%,#35c4cc 75%,#3fd6dc 100%);
    overflow:hidden;
  }
  .navbtns{display:flex;gap:12px;margin-bottom:34px}
  .navbtns button{
    width:40px;height:40px;padding:0;border-radius:50%;
    background:#0d1a22;color:#fff;font-family:var(--body);font-size:20px;font-weight:700;letter-spacing:0;
    display:grid;place-items:center;
  }
  .byline{
    color:var(--lime);font-family:var(--heading);font-size:14px;letter-spacing:.14em;
    margin-bottom:12px;
  }
  .title{
    font-family:var(--heading);
    font-size:clamp(28px,5vw,54px);
    line-height:1.08;
    color:#eef7f3;
    text-shadow:0 3px 0 rgba(0,0,0,.18);
    margin-bottom:8px;
  }
  .subtitle{font-family:var(--heading);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.65);margin-bottom:26px}

  /* ---------- Formulario ---------- */
  form{
    background:rgba(27,39,51,.88);
    backdrop-filter:blur(6px);
    border-radius:18px;
    padding:clamp(18px,3vw,32px);
    max-width:820px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px 22px;
    box-shadow:0 18px 40px rgba(0,0,0,.35);
  }
  .field{display:flex;flex-direction:column;gap:6px}
  .field.full{grid-column:1/-1}
  label{font-weight:700;font-size:14px;color:var(--aqua)}
  input{
    font:inherit;color:var(--text);
    background:rgba(255,255,255,.08);
    border:2px solid rgba(255,255,255,.18);
    border-radius:12px;
    padding:12px 14px;
    outline:none;
    transition:border-color .2s, background .2s, box-shadow .2s;
    width:100%;
  }
  input::placeholder{color:rgba(255,255,255,.4)}
  input:focus{
    border-color:var(--aqua);
    background:rgba(255,255,255,.13);
    box-shadow:0 0 0 4px rgba(63,216,196,.22);
  }
  input[type="date"]{color-scheme:dark}
  .field.invalid input{border-color:var(--bad);box-shadow:0 0 0 4px rgba(229,56,59,.2)}
  .field.valid input{border-color:var(--ok)}
  .msg{font-size:13px;min-height:16px;color:#ff8a8c;font-weight:600}
  .hint{color:#ffd166}

  /* ---------- Selector de fecha (ruedas) ---------- */
  .field{position:relative}
  .date-btn{
    font-family:var(--body);font-size:16px;letter-spacing:0;font-weight:400;
    color:var(--text);text-align:center;width:100%;
    background:rgba(255,255,255,.08);
    border:2px solid rgba(255,255,255,.18);
    border-radius:12px;padding:12px 14px;
    transition:border-color .2s, background .2s, box-shadow .2s;
  }
  .date-btn:hover{filter:none;transform:none;background:rgba(255,255,255,.13)}
  .date-btn:active{transform:none}
  .date-btn:focus-visible,.date-btn[aria-expanded="true"]{
    outline:none;border-color:var(--aqua);box-shadow:0 0 0 4px rgba(63,216,196,.22);
  }
  .date-btn .ph{color:rgba(255,255,255,.4)}
  .field.invalid .date-btn{border-color:var(--bad);box-shadow:0 0 0 4px rgba(229,56,59,.2)}
  .field.valid .date-btn{border-color:var(--ok)}

  .picker{
    position:absolute;z-index:30;left:0;top:calc(100% + 10px);
    width:100%;min-width:290px;max-width:360px;
    background:#2e3133;color:#e8e8e0;
    border-radius:18px;box-shadow:0 18px 40px rgba(0,0,0,.5);
    overflow:hidden;
  }
  .picker[hidden]{display:none}
  .pk-head{padding:18px 20px 6px;font-size:19px;font-weight:600}
  .wheels{
    position:relative;display:grid;grid-template-columns:.8fr 1.4fr 1fr;
    height:220px;margin:6px 12px;
  }
  .wheels::before{
    content:"";position:absolute;left:0;right:0;top:50%;height:44px;margin-top:-22px;
    background:rgba(255,255,255,.12);border-radius:10px;pointer-events:none;
  }
  .wheel{
    height:220px;overflow-y:scroll;scroll-snap-type:y mandatory;
    padding:88px 0;scrollbar-width:none;position:relative;
    -webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);
            mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);
  }
  .wheel::-webkit-scrollbar{display:none}
  .wheel{overscroll-behavior:contain;touch-action:pan-y;cursor:grab}
  .wheel:focus-visible{outline:2px solid var(--aqua);outline-offset:-2px;border-radius:10px}
  .wheel-item{
    height:44px;line-height:44px;text-align:center;scroll-snap-align:center;
    font-size:19px;color:rgba(232,232,224,.55);cursor:pointer;user-select:none;
  }
  .wheel-item.on{color:#fff;font-size:22px}
  .arrows{display:grid;grid-template-columns:.8fr 1.4fr 1fr;margin:0 12px}
  .arrows:first-of-type{margin-top:6px}
  .arrow{
    font-family:var(--body);letter-spacing:0;font-size:16px;line-height:1;font-weight:400;
    background:none;border:0;border-radius:10px;color:#d9d9d4;padding:10px 0;
    touch-action:manipulation;user-select:none;
  }
  .arrow:hover{filter:none;transform:none;background:rgba(255,255,255,.1);color:#fff}
  .arrow:active{transform:none;background:rgba(63,216,196,.3)}
  .pk-foot{display:flex;justify-content:space-between;border-top:1px solid rgba(255,255,255,.12);margin-top:8px}
  .pk-link{
    font-family:var(--body);font-size:18px;letter-spacing:0;font-weight:500;
    background:none;border:0;border-radius:0;color:#d9d9d4;padding:14px 20px;
  }
  .pk-link:hover{filter:none;transform:none;background:rgba(255,255,255,.06)}
  .pk-link:active{transform:none}
  .pk-link.listo{color:#fff;font-weight:700}

  /* ---------- Opciones de tarjeta ---------- */
  .choices{display:flex;flex-wrap:wrap;gap:10px}
  .choices input{position:absolute;opacity:0;width:1px;height:1px;padding:0;border:0;pointer-events:none}
  .pill{
    display:inline-flex;align-items:center;gap:8px;cursor:pointer;
    padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;color:var(--text);
    background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.18);
    transition:background .2s,border-color .2s,transform .15s;
  }
  .pill:hover{background:rgba(255,255,255,.14)}
  .choices input:checked + .pill{
    background:linear-gradient(135deg,var(--sky),var(--aqua));
    border-color:var(--cream);
    transform:translateY(-1px);
  }
  .choices input:focus-visible + .pill{outline:3px solid var(--cream);outline-offset:2px}
  .field.invalid .pill{border-color:var(--bad)}

  /* ---------- Botón ---------- */
  .actions{grid-column:1/-1;display:flex;flex-direction:column;gap:14px;margin-top:6px}
  button{
    font-family:var(--heading);font-size:17px;letter-spacing:.04em;
    color:#fff;border:0;border-radius:999px;padding:15px 20px;cursor:pointer;
    background:linear-gradient(135deg,var(--sky),var(--aqua));
    transition:transform .15s, filter .2s, background .25s;
  }
  button:hover{filter:brightness(1.08);transform:translateY(-1px)}
  button:active{transform:translateY(1px)}
  button:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
  button.error{background:var(--bad);animation:shake .4s}
  button.success{background:var(--ok)}
  @keyframes shake{
    20%{transform:translateX(-7px)} 40%{transform:translateX(7px)}
    60%{transform:translateX(-5px)} 80%{transform:translateX(5px)}
  }
  .result{
    display:none;text-align:center;font-weight:800;font-size:18px;
    background:rgba(31,184,106,.18);border:2px solid var(--ok);
    color:#aef5cf;border-radius:14px;padding:14px;
  }
  .result.show{display:block}

  @media (max-width:820px){
    body{flex-direction:column}
    .side{width:100%;padding:16px;gap:14px}
    .side-title{display:none}
    .side nav{flex-direction:row;overflow-x:auto;scrollbar-width:none}
    .side nav::-webkit-scrollbar{display:none}
    .side nav a{white-space:nowrap;flex-shrink:0;padding:10px 14px}
  }
  @media (max-width:600px){
    form{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){
    button.error{animation:none}
  }
</style>
</head>
<body>

<aside class="side">
  <div class="brand">
    <div class="logo">🎧</div>
    <h2>Music mente de caos</h2>
  </div>
  <nav aria-label="Menú principal">
    <a href="index.html"><span class="ico">⌕</span>Inicio</a>
    <a href="Canserbero.html"><span class="ico">⌕</span>Canserbero</a>
    <a href="Aleman.html"><span class="ico">▤</span>Aleman</a>
    <a href="Eminem.html"><span class="ico">▤</span>Eminem</a>
    <a href="Kendrick Lamar.html"><span class="ico">▤</span>Kendrick Lamar</a>
    <a href="Jaz-Z.html"><span class="ico">▤</span>Jaz-Z</a>
  </nav>
</aside>

<main class="main">
  <div class="navbtns">
    <button type="button" onclick="history.back()" aria-label="Regresar">‹</button>
    <button type="button" onclick="history.forward()" aria-label="Adelante">›</button>
  </div>

  <p class="byline">KATHY MARTINEZ MARINEZ 🎧</p>
  <h1 class="title">¡🎧 REGÍSTRATE EN MUSIC MENTE DE CAOS 🎧!</h1>
  <p class="subtitle">Llena tus datos y presiona Validar.</p>

  <form id="formulario" novalidate autocomplete="off">

    <div class="field full" data-campo="nombre">
      <label for="nombre">Nombre</label>
      <input id="nombre" type="text" maxlength="100" placeholder="EJ. JOSÉ ÁNGEL" data-tipo="letras">
      <span class="msg"></span>
    </div>

    <div class="field" data-campo="paterno">
      <label for="paterno">Apellido paterno</label>
      <input id="paterno" type="text" maxlength="100" placeholder="EJ. MARTÍNEZ" data-tipo="letras">
      <span class="msg"></span>
    </div>

    <div class="field" data-campo="materno">
      <label for="materno">Apellido materno</label>
      <input id="materno" type="text" maxlength="100" placeholder="EJ. NÚÑEZ" data-tipo="letras">
      <span class="msg"></span>
    </div>

    <div class="field" data-campo="edad">
      <label for="edad">Edad</label>
      <input id="edad" type="text" inputmode="numeric" maxlength="3" placeholder="EJ. 25" data-tipo="edad">
      <span class="msg"></span>
    </div>

    <div class="field" data-campo="nacimiento">
      <label for="nacimiento">Fecha de nacimiento</label>
      <input id="nacimiento" type="hidden">
      <button type="button" class="date-btn" id="nacBtn" aria-haspopup="dialog" aria-expanded="false">
        <span id="nacTexto" class="ph">Elige tu fecha</span>
      </button>
      <div class="picker" id="picker" role="dialog" aria-label="Elegir fecha de nacimiento" hidden>
        <div class="pk-head" id="pkHead"></div>
        <div class="arrows">
          <button type="button" class="arrow" data-w="d" data-dir="-1" aria-label="Subir día">▲</button>
          <button type="button" class="arrow" data-w="m" data-dir="-1" aria-label="Subir mes">▲</button>
          <button type="button" class="arrow" data-w="y" data-dir="-1" aria-label="Subir año">▲</button>
        </div>
        <div class="wheels">
          <div class="wheel" id="wDia" aria-label="Día"></div>
          <div class="wheel" id="wMes" aria-label="Mes"></div>
          <div class="wheel" id="wAnio" aria-label="Año"></div>
        </div>
        <div class="arrows">
          <button type="button" class="arrow" data-w="d" data-dir="1" aria-label="Bajar día">▼</button>
          <button type="button" class="arrow" data-w="m" data-dir="1" aria-label="Bajar mes">▼</button>
          <button type="button" class="arrow" data-w="y" data-dir="1" aria-label="Bajar año">▼</button>
        </div>
        <div class="pk-foot">
          <button type="button" class="pk-link" id="pkReset">Restablecer</button>
          <button type="button" class="pk-link listo" id="pkOk">Listo</button>
        </div>
      </div>
      <span class="msg"></span>
    </div>

    <div class="field full" data-campo="email">
      <label for="email">Correo electrónico</label>
      <input id="email" type="text" inputmode="email" maxlength="100" placeholder="ejemplo@gmail">
      <span class="msg"></span>
    </div>

    <div class="field full" data-campo="marca">
      <label>Tipo de tarjeta</label>
      <div class="choices">
        <input type="radio" name="marca" id="marca" value="visa"><label class="pill" for="marca">Visa</label>
        <input type="radio" name="marca" id="marcaMc" value="mastercard"><label class="pill" for="marcaMc">Mastercard</label>
        <input type="radio" name="marca" id="marcaAmex" value="amex"><label class="pill" for="marcaAmex">American Express</label>
        <input type="radio" name="marca" id="marcaDisc" value="discover"><label class="pill" for="marcaDisc">Discover</label>
      </div>
      <span class="msg"></span>
    </div>

    <div class="field full" data-campo="numTarjeta">
      <label for="numTarjeta">Número de tarjeta</label>
      <input id="numTarjeta" type="text" inputmode="numeric" maxlength="16" placeholder="16 dígitos" data-tipo="tarjeta">
      <span class="msg"></span>
    </div>

    <div class="actions">
      <button type="button" id="btnValidar">Validar</button>
      <div class="result" id="resultado" role="status" aria-live="polite">✅GRACIAS POR SUSCRIBIRTE A MUSIC MENTE DE CAOS DISFRUTA DE LA BUENA MUSICA </div>
    </div>
  </form>
</main>

<script>
  const btn = document.getElementById('btnValidar');
  const resultado = document.getElementById('resultado');

  // Reglas de limpieza mientras se escribe
  const limpiar = {
    // Letras (con acentos, ñ y ü) y espacios; todo en mayúsculas; máx. 100
    letras: v => v.toUpperCase().replace(/[^A-ZÁÉÍÓÚÜÑ ]/g, '').slice(0, 100),
    // Solo números, máx. 3
    edad: v => v.replace(/\D/g, '').slice(0, 3),
    // Solo números, máx. 16 (American Express: 15)
    tarjeta: v => v.replace(/\D/g, '').slice(0, maxTarjeta())
  };

  function maxTarjeta() {
    const m = document.querySelector('input[name="marca"]:checked');
    return m && m.value === 'amex' ? 15 : 16;
  }

  // Al elegir tipo o marca
  document.querySelectorAll('input[type="radio"]').forEach(r => {
    r.addEventListener('change', () => {
      mostrar(r, '');
      if (r.name === 'marca') {
        const num = document.getElementById('numTarjeta');
        const max = maxTarjeta();
        num.maxLength = max;
        num.placeholder = max + ' dígitos';
        num.value = num.value.slice(0, max);
      }
      reiniciarBoton();
    });
  });

  const avisos = {
    letras: 'Solo letras y espacios (sin números ni símbolos).',
    edad: 'Solo números.',
    tarjeta: 'Solo números.'
  };

  function mostrar(campo, texto, tipo) {
    const cont = campo.closest('.field');
    const msg = cont.querySelector('.msg');
    cont.classList.remove('invalid', 'valid');
    msg.classList.remove('hint');
    if (tipo === 'error') cont.classList.add('invalid');
    if (tipo === 'ok') cont.classList.add('valid');
    if (tipo === 'hint') msg.classList.add('hint');
    msg.textContent = texto || '';
  }

  // Limpieza en vivo
  document.querySelectorAll('input[data-tipo]').forEach(inp => {
    inp.addEventListener('input', () => {
      const tipo = inp.dataset.tipo;
      const antes = inp.value;
      const pos = inp.selectionStart;
      const despues = limpiar[tipo](antes);
      if (antes !== despues) {
        inp.value = despues;
        const nuevaPos = Math.max(0, pos - (antes.length - despues.length));
        inp.setSelectionRange(nuevaPos, nuevaPos);
        // Aviso solo si se quitó algo que no sea cambio de minúscula a mayúscula
        const soloMayus = antes.toUpperCase() === despues && tipo === 'letras';
        if (!soloMayus) mostrar(inp, avisos[tipo], 'hint');
        else mostrar(inp, '');
      } else {
        mostrar(inp, '');
      }
      reiniciarBoton();
    });
  });

  ['email'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
      mostrar(document.getElementById(id), '');
      reiniciarBoton();
    });
  });

  function reiniciarBoton() {
    btn.className = '';
    btn.textContent = 'Validar';
    resultado.classList.remove('show');
  }

  // Validaciones
  const reNombre = /^[A-ZÁÉÍÓÚÜÑ ]+$/;
  const reEmail = /^[A-Za-z0-9ñÑ._%+\-]+@[A-Za-z0-9ñÑ\-]+(\.[A-Za-z0-9ñÑ\-]+)*$/;

  function validarNombre(id, etiqueta) {
    const el = document.getElementById(id);
    const v = el.value.trim();
    if (!v) return `${etiqueta} es obligatorio.`;
    if (v.length > 100) return 'Máximo 100 letras.';
    if (!reNombre.test(v)) return 'Solo letras y espacios.';
    return '';
  }

  function validarTodo() {
    const errores = {};

    ['nombre|Nombre', 'paterno|Apellido paterno', 'materno|Apellido materno']
      .forEach(par => {
        const [id, et] = par.split('|');
        const e = validarNombre(id, et);
        if (e) errores[id] = e;
      });

    const edad = document.getElementById('edad').value;
    if (!edad) errores.edad = 'La edad es obligatoria.';
    else if (!/^\d{1,3}$/.test(edad) || Number(edad) < 1) errores.edad = 'Escribe una edad válida (1 a 3 números).';

    const nac = document.getElementById('nacimiento').value;
    if (!nac) errores.nacimiento = 'Elige tu fecha de nacimiento.';
    else {
      const f = new Date(nac + 'T00:00:00');
      const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
      if (isNaN(f) || f > hoy) errores.nacimiento = 'La fecha no puede ser futura.';
      else if (f.getFullYear() < 1900) errores.nacimiento = 'Fecha demasiado antigua.';
    }

    const email = document.getElementById('email').value.trim();
    if (!email) errores.email = 'El correo es obligatorio.';
    else if (email.length > 100) errores.email = 'Máximo 100 caracteres.';
    else if (!reEmail.test(email)) errores.email = 'Correo no válido. Ej: nombre@gmail';

    if (!document.querySelector('input[name="marca"]:checked')) errores.marca = 'Elige el tipo de tu tarjeta.';

    const tarjeta = document.getElementById('numTarjeta').value;
    const largo = maxTarjeta();
    if (!tarjeta) errores.numTarjeta = 'El número de tarjeta es obligatorio.';
    else if (tarjeta.length !== largo || !/^\d+$/.test(tarjeta)) errores.numTarjeta = `Deben ser ${largo} dígitos.`;

    return errores;
  }

  btn.addEventListener('click', () => {
    const errores = validarTodo();
    const ids = ['nombre', 'paterno', 'materno', 'edad', 'nacimiento', 'email', 'marca', 'numTarjeta'];

    ids.forEach(id => {
      const el = document.getElementById(id);
      if (errores[id]) mostrar(el, errores[id], 'error');
      else mostrar(el, '', 'ok');
    });

    btn.className = '';
    void btn.offsetWidth; // reinicia la animación

    if (Object.keys(errores).length) {
      btn.classList.add('error');
      btn.textContent = 'Error';
      resultado.classList.remove('show');
      const primero = ids.find(id => errores[id]);
      (primero === 'nacimiento' ? document.getElementById('nacBtn') : document.getElementById(primero)).focus();
    } else {
      btn.classList.add('success');
      btn.textContent = 'Validar';
      resultado.classList.add('show');
    }
  });

  // ---------- Selector de fecha con ruedas ----------
  (function () {
    const ITEM = 44;
    const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
    const CORTO = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    const hidden = document.getElementById('nacimiento');
    const btn = document.getElementById('nacBtn');
    const texto = document.getElementById('nacTexto');
    const picker = document.getElementById('picker');
    const head = document.getElementById('pkHead');
    const wDia = document.getElementById('wDia');
    const wMes = document.getElementById('wMes');
    const wAnio = document.getElementById('wAnio');
    const hoy = new Date();
    const anioMax = hoy.getFullYear();
    const anios = [];
    for (let y = anioMax; y >= 1900; y--) anios.push(y);   // más reciente arriba
    let sel = { d: hoy.getDate(), m: hoy.getMonth(), y: Math.min(2000, anioMax) };
    let diasMostrados = 0;

    const diasDelMes = (y, m) => new Date(y, m + 1, 0).getDate();

    function marcar(wheel, idx) {
      [...wheel.children].forEach((c, i) => c.classList.toggle('on', i === idx));
    }

    function llenar(wheel, items, idx) {
      wheel.innerHTML = '';
      items.forEach((t, i) => {
        const it = document.createElement('div');
        it.className = 'wheel-item';
        it.textContent = t;
        it.addEventListener('click', () => wheel.scrollTo({ top: i * ITEM, behavior: 'smooth' }));
        wheel.appendChild(it);
      });
      wheel.scrollTop = idx * ITEM;
      marcar(wheel, idx);
    }

    function llenarDias() {
      const n = diasDelMes(sel.y, sel.m);
      if (sel.d > n) sel.d = n;
      if (n !== diasMostrados) {
        diasMostrados = n;
        llenar(wDia, Array.from({ length: n }, (_, i) => String(i + 1)), sel.d - 1);
      }
    }

    function actualizarCabecera() {
      head.textContent = MESES[sel.m] + ' de ' + sel.y;
    }

    function alScroll(wheel, tipo) {
      let t;
      wheel.addEventListener('scroll', () => {
        clearTimeout(t);
        t = setTimeout(() => {
          const max = wheel.children.length - 1;
          const idx = Math.max(0, Math.min(max, Math.round(wheel.scrollTop / ITEM)));
          marcar(wheel, idx);
          if (tipo === 'd') sel.d = idx + 1;
          if (tipo === 'm') sel.m = idx;
          if (tipo === 'y') sel.y = anios[idx];
          if (tipo !== 'd') llenarDias();
          actualizarCabecera();
        }, 25);
      });
    }
    alScroll(wDia, 'd'); alScroll(wMes, 'm'); alScroll(wAnio, 'y');

    // Mover con rueda del mouse, arrastrando con el mouse o con las flechas del teclado
    function habilitarMovimiento(wheel) {
      const irA = idx => {
        const max = wheel.children.length - 1;
        wheel.scrollTo({ top: Math.max(0, Math.min(max, idx)) * ITEM, behavior: 'smooth' });
      };
      const actual = () => Math.round(wheel.scrollTop / ITEM);

      // Rueda del mouse / touchpad: un paso por giro
      let ultimo = 0;
      wheel.addEventListener('wheel', e => {
        e.preventDefault();
        const ahora = Date.now();
        if (ahora - ultimo < 90 || !e.deltaY) return;
        ultimo = ahora;
        irA(actual() + Math.sign(e.deltaY));
      }, { passive: false });

      // Arrastrar con el mouse
      let y0 = 0, top0 = 0, abajo = false, arrastrando = false;
      wheel.addEventListener('pointerdown', e => {
        if (e.pointerType !== 'mouse') return;
        abajo = true; arrastrando = false; y0 = e.clientY; top0 = wheel.scrollTop;
      });
      wheel.addEventListener('pointermove', e => {
        if (!abajo) return;
        const dy = e.clientY - y0;
        if (!arrastrando && Math.abs(dy) > 4) {
          arrastrando = true;
          wheel.setPointerCapture(e.pointerId);
          wheel.style.scrollSnapType = 'none';
        }
        if (arrastrando) wheel.scrollTop = top0 - dy;
      });
      const soltar = () => {
        if (!abajo) return;
        abajo = false;
        if (arrastrando) {
          arrastrando = false;
          wheel.style.scrollSnapType = '';
          irA(actual());
        }
      };
      wheel.addEventListener('pointerup', soltar);
      wheel.addEventListener('pointercancel', soltar);

      // Flechas del teclado
      wheel.tabIndex = 0;
      wheel.addEventListener('keydown', e => {
        if (e.key === 'ArrowDown') { e.preventDefault(); irA(actual() + 1); }
        if (e.key === 'ArrowUp') { e.preventDefault(); irA(actual() - 1); }
      });
    }
    [wDia, wMes, wAnio].forEach(habilitarMovimiento);

    // Flechitas: un toque = un paso; mantener presionado = avanza rápido
    const mapa = { d: wDia, m: wMes, y: wAnio };
    document.querySelectorAll('.arrow').forEach(b => {
      const w = mapa[b.dataset.w];
      const dir = Number(b.dataset.dir);
      let t1, t2, n = 0;
      const paso = () => {
        n++;
        const k = n > 14 ? 3 : 1;              // después de un rato, avanza más rápido
        const max = w.children.length - 1;
        const idx = Math.max(0, Math.min(max, Math.round(w.scrollTop / ITEM) + dir * k));
        w.scrollTo({ top: idx * ITEM, behavior: 'auto' });
      };
      const parar = () => { clearTimeout(t1); clearInterval(t2); };
      b.addEventListener('pointerdown', e => {
        e.preventDefault();
        n = 0; paso();
        t1 = setTimeout(() => { t2 = setInterval(paso, 55); }, 300);
      });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, parar));
      b.addEventListener('click', e => { if (e.detail === 0) { n = 0; paso(); } }); // teclado
    });

    function abrir() {
      if (hidden.value) {
        const [y, m, d] = hidden.value.split('-').map(Number);
        sel = { d, m: m - 1, y };
      } else {
        sel = { d: hoy.getDate(), m: hoy.getMonth(), y: Math.min(2000, anioMax) };
      }
      picker.hidden = false;
      btn.setAttribute('aria-expanded', 'true');
      diasMostrados = 0;
      llenar(wMes, MESES, sel.m);
      llenar(wAnio, anios.map(String), anios.indexOf(sel.y));
      llenarDias();
      actualizarCabecera();
    }

    function cerrar() {
      picker.hidden = true;
      btn.setAttribute('aria-expanded', 'false');
    }

    btn.addEventListener('click', () => (picker.hidden ? abrir() : cerrar()));

    document.getElementById('pkOk').addEventListener('click', () => {
      const mm = String(sel.m + 1).padStart(2, '0');
      const dd = String(sel.d).padStart(2, '0');
      hidden.value = `${sel.y}-${mm}-${dd}`;
      texto.textContent = `${sel.d} ${CORTO[sel.m]} ${sel.y}`;
      texto.classList.remove('ph');
      mostrar(hidden, '');
      reiniciarBoton();
      cerrar();
    });

    document.getElementById('pkReset').addEventListener('click', () => {
      hidden.value = '';
      texto.textContent = 'Elige tu fecha';
      texto.classList.add('ph');
      mostrar(hidden, '');
      reiniciarBoton();
      cerrar();
    });

    document.addEventListener('click', e => {
      if (!picker.hidden && !picker.contains(e.target) && !btn.contains(e.target)) cerrar();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && !picker.hidden) { cerrar(); btn.focus(); }
    });
  })();
</script>
</body>
